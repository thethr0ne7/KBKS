name: Apply KBKS brand assets

on:
  push:
    branches:
      - feature/kbks-logo-final

permissions:
  contents: write

jobs:
  apply-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/kbks-logo-final

      - name: Apply logo integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('docs/index.html')
          css_path = Path('docs/styles.css')
          symbol_path = Path('docs/assets/brand/kbks-symbol.png')
          emblem_path = Path('docs/assets/brand/kbks-emblem.png')

          for asset in (symbol_path, emblem_path):
              if not asset.exists() or asset.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty brand asset: {asset}')

          html = index_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Expected block not found: {label}')
              return text.replace(old, new, 1)

          html = replace_once(
              html,
              '  <title>КБКС · Автошкола — интерактивный прототип</title>',
              '  <title>КБКС · Автошкола — интерактивный прототип</title>\n  <link rel="icon" href="./assets/brand/kbks-symbol.png" type="image/png">',
              'favicon'
          )

          old_header = '''        <a class="kbks-auto-brand" href="#top" aria-label="КБКС Автошкола — наверх">
          <span class="kbks-auto-brand__mark" aria-hidden="true">К</span>
          <span class="kbks-auto-brand__text">
            <strong>КБКС</strong>
            <span>Автошкола</span>
          </span>
        </a>'''
          new_header = '''        <a class="kbks-auto-brand" href="#top" aria-label="Автошкола КБКС — наверх">
          <img
            class="kbks-auto-brand__symbol"
            src="./assets/brand/kbks-symbol.png"
            alt=""
            width="116"
            height="44"
          >
          <span class="kbks-auto-brand__text">
            <strong>Автошкола КБКС</strong>
            <span>Образовательное направление колледжа</span>
          </span>
        </a>'''
          html = replace_once(html, old_header, new_header, 'header brand')

          html = replace_once(
              html,
              '<span>Заменить реальной фотографией после съёмки</span>',
              '<span>Декоративный силуэт автомобиля</span>',
              'car caption'
          )

          trust_anchor = '''          <div class="kbks-auto-trust-layout">
            <article class="kbks-auto-document-card">'''
          trust_replacement = '''          <div class="kbks-auto-trust-layout">
            <article class="kbks-auto-identity-card">
              <img
                class="kbks-auto-identity-card__emblem"
                src="./assets/brand/kbks-emblem.png"
                alt="Эмблема Кабардино-Балкарского колледжа «Строитель»"
                width="112"
                height="112"
              >
              <div>
                <span class="kbks-auto-status kbks-auto-status--confirmed">Официальная принадлежность</span>
                <h3>Автошкола КБКС</h3>
                <p>Раздел сохраняет прямую связь с ГБПОУ «Кабардино-Балкарский колледж „Строитель“» и использует официальную эмблему учреждения.</p>
                <a class="kbks-auto-text-link" href="https://kb-ks.ru/" target="_blank" rel="noopener noreferrer">
                  Перейти на основной сайт КБКС
                  <svg aria-hidden="true"><use href="#icon-arrow-up-right"/></svg>
                </a>
              </div>
            </article>

            <article class="kbks-auto-document-card">'''
          html = replace_once(html, trust_anchor, trust_replacement, 'trust identity')

          old_footer = '''          <a class="kbks-auto-brand kbks-auto-brand--footer" href="#top">
            <span class="kbks-auto-brand__mark" aria-hidden="true">К</span>
            <span class="kbks-auto-brand__text"><strong>КБКС</strong><span>Автошкола</span></span>
          </a>'''
          new_footer = '''          <a class="kbks-auto-brand kbks-auto-brand--footer" href="#top" aria-label="Автошкола КБКС — наверх">
            <img
              class="kbks-auto-brand__emblem"
              src="./assets/brand/kbks-emblem.png"
              alt=""
              width="64"
              height="64"
            >
            <span class="kbks-auto-brand__text"><strong>Автошкола КБКС</strong><span>kb-ks.ru/avtoshkola</span></span>
          </a>'''
          html = replace_once(html, old_footer, new_footer, 'footer brand')

          marker = '/* KBKS BRAND ASSETS — integrated */'
          if marker not in css:
              css += r'''

/* KBKS BRAND ASSETS — integrated */
.kbks-auto-brand__symbol {
  display: block;
  width: 116px;
  height: 44px;
  flex: 0 0 116px;
  object-fit: contain;
  object-position: left center;
}

.kbks-auto-brand__emblem {
  display: block;
  width: 64px;
  height: 64px;
  flex: 0 0 64px;
  object-fit: contain;
  border-radius: 50%;
  background: #fff;
}

.kbks-auto-brand__text strong {
  font-size: 15px;
  letter-spacing: -0.01em;
}

.kbks-auto-identity-card {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 24px;
  padding: 28px;
  border: 1px solid var(--auto-border);
  border-radius: var(--auto-radius-large);
  background: linear-gradient(135deg, #fff 0%, var(--auto-primary-faint) 100%);
  box-shadow: var(--auto-shadow-subtle);
}

.kbks-auto-identity-card__emblem {
  display: block;
  width: 112px;
  height: 112px;
  object-fit: contain;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
}

.kbks-auto-identity-card h3 {
  margin: 10px 0 8px;
}

.kbks-auto-identity-card p {
  max-width: 68ch;
  color: var(--auto-muted);
}

@media (max-width: 767px) {
  .kbks-auto-brand__symbol {
    width: 84px;
    height: 36px;
    flex-basis: 84px;
  }

  .kbks-auto-brand__text span {
    display: none;
  }

  .kbks-auto-identity-card {
    grid-template-columns: 1fr;
    align-items: start;
  }

  .kbks-auto-identity-card__emblem {
    width: 88px;
    height: 88px;
  }
}
'''

          index_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/styles.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate official KBKS brand assets"
          git push origin HEAD:feature/kbks-logo-final
